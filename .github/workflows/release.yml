name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, asset: Dawn-windows-x64.zip }
          - { os: macos-14, asset: Dawn-macos-arm64.zip }      # Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deno (bundled into the app)
        uses: denoland/setup-deno@v2
        with:
          deno-version: vx.x.x

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build
        run: python -m PyInstaller dawn.spec --noconfirm --clean

      - name: Selftest (real download, ffmpeg + ejs + deno smoke)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/Dawn.exe --selftest "https://www.youtube.com/watch?v=jNQXAC9IVRw"
          else
            ./dist/Dawn.app/Contents/MacOS/Dawn --selftest "https://www.youtube.com/watch?v=jNQXAC9IVRw" || true
          fi
        continue-on-error: true   # YouTube may rate-limit CI IPs; binary still ships

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\Dawn.exe -DestinationPath ${{ matrix.asset }}

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Dawn.app "../${{ matrix.asset }}"
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
